<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#282c23">
  <title>Little Chinchilla</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">龙猫小屋</p><h1>Little Chinchilla</h1></div>
      <div class="trust">
        <label for="trust">信任度 <span id="score">0 / 100</span></label>
        <meter id="trust" min="0" max="100" value="0">0 / 100</meter>
        <span id="bond">还在熟悉你</span>
      </div>
    </header>

    <section class="room" aria-label="傍晚的龙猫小屋">
      <span class="activity" id="activity">观察四周</span>
      <div class="bath" aria-hidden="true"></div>
      <div class="pet" id="pet" data-action="idle" data-place="floor" aria-hidden="true">
        <img src="./assets/chinchilla.webp" alt="" draggable="false">
      </div>
    </section>

    <section class="care" aria-label="照顾龙猫">
      <p id="message" role="status">小银正在熟悉你的气味。可以先给它一点提摩西草。</p>
      <div class="actions">
        <button type="button" data-care="feed"><span aria-hidden="true">🌿</span>喂食</button>
        <button type="button" data-care="pet"><span aria-hidden="true">✦</span>轻轻抚摸</button>
        <button type="button" data-care="bath"><span aria-hidden="true">◒</span>准备沙浴</button>
      </div>
      <p class="hint" id="hint">每次互动后稍等片刻，小银会自己休息、跳跃和梳理毛发。</p>
      <p id="save-warning" hidden>浏览器无法保存进度，本次进度只在当前页面保留。</p>
    </section>
  </main>
</body>
</html>
